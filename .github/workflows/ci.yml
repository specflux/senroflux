name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: PHPCS (WordPress-Core + WordPress-Extra)
        run: composer lint

      - name: PHPStan level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  editor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm ci --no-audit --no-fund

      # The block editor's own validation over the shipped patterns and a
      # cleaned page: catches "Block contains unexpected or invalid content"
      # that the PHP round-trip check cannot see.
      - name: Editor parity
        run: npm run test:editor

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WordPress.org's official static checks (S12): readme, headers,
      # escaping, i18n usage.
      # Stage a clean, distribution-shaped copy (no tests/, configs, CI) so
      # the checker sees exactly what ships in the zip.
      - name: Assemble distribution copy
        run: |
          mkdir -p build/senroflux/assets
          cp -R src readme.txt senroflux.php LICENSE build/senroflux/
          cp -R assets/. build/senroflux/assets/
          rm -f build/senroflux/.DS_Store

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/senroflux
