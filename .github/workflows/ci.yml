name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: PHPCS (WordPress-Core + WordPress-Extra)
        run: composer lint

      - name: PHPStan level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WordPress.org's official static checks (S12): readme, headers,
      # escaping, i18n usage.
      - uses: wordpress/plugin-check-action@v1
        with:
          checks: runtime_checks,static_checks
